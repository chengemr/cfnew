name: Defender release diagnostics

on:
  push:
    branches: ['diagnose-defender-v4.0.7']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defender:
    name: Defender (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Scan original published releases with Microsoft Defender
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/defender-diagnostics.ps1 -Repository $env:GITHUB_REPOSITORY -ReportDirectory "$env:GITHUB_WORKSPACE/defender-report" -EnhanceProtection
      - name: Publish diagnostic evidence as check annotations
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'defender-report'
          foreach ($name in @('summary.json','readiness.json','defender-after-prepare.json','preparation-errors.json','sample-root-exclusion.json','maps-connectivity.json')) {
            $path = Join-Path $root $name
            if (Test-Path -LiteralPath $path) {
              $value = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
              if ($name -eq 'summary.json') {
                foreach ($result in @($value.Results)) {
                  $item = [ordered]@{ Tag=$result.Tag; Asset=$result.Asset; Outcome=$result.Outcome; Error=$result.Error; ReleaseError=$result.ReleaseError; ExpectedSHA256=$result.ExpectedSHA256; ActualSHA256=$result.ActualSHA256; HashVerifiedBeforeWrite=$result.HashVerifiedBeforeWrite; ConsoleThreatNames=$result.ConsoleThreatNames; AttachmentCheck=$result.AttachmentCheck; HashAfterAttachmentCheck=$result.HashAfterAttachmentCheck; Exclusion=$result.Exclusion; Scan=$result.Scan; FilePresentAfterWrite=$result.FilePresentAfterWrite; FilePresentAfterScan=$result.FilePresentAfterScan; MatchingDetectionEvents=$result.MatchingDetectionEvents }
                  $message = (ConvertTo-Json -InputObject $item -Depth 10 -Compress).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                  Write-Host "::notice title=Sample $($result.Tag) $($result.Asset)::$message"
                }
                $value = [ordered]@{ Overall=$value.Overall; Ready=$value.Ready; FatalError=$value.FatalError; PreparationErrors=$value.PreparationErrors }
              }
              $message = (ConvertTo-Json -InputObject $value -Depth 10 -Compress).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::notice title=${name}::$message"
            } else {
              Write-Host "::warning title=Missing diagnostic report::$name was not produced"
            }
          }
      - name: Preserve engine state, detections and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defender-${{ matrix.os }}
          path: defender-report/
          if-no-files-found: warn
          retention-days: 30
