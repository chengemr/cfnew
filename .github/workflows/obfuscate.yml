name: Generate and Obfuscate Worker Script

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '明文源吗'

permissions:
  contents: write

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run obfuscate
      - run: npm run check
      - name: Commit generated Workers if they changed
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add '明文源吗' '少年你相信光吗'
          if ! git diff --staged --quiet; then
            git commit -m 'build: regenerate Worker artifacts'
            git push
          fi
